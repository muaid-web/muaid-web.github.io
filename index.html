        body {

        }
        /* Basic styling for hidden sections */
        .page-section {
            display: none;
        }
        .page-section.active {
            display: block;
        }
        /* Custom modal styling */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000; /* High z-index */
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .modal-content {
            background-color: white;
            padding: 2rem;
            border-radius: 0.5rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 90%;
            width: 500px; /* Adjust as needed */
            max-height: 90vh;
            overflow-y: auto;
        }

                                        <div class="space-y-3 text-gray-700">
                                            <p class="flex items-start">${createIcon('map-pin', 'w-6 h-6 mr-3 mt-1 text-teal-600 flex-shrink-0')}<span><strong>Address:</strong><br>${clinicData.contact.address}</span></p>
                                            <p class="flex items-center">${createIcon('phone', 'w-5 h-5 mr-3 text-teal-600 flex-shrink-0')}<strong>Phone:</strong> <a href="tel:${clinicData.contact.phone}" class="ml-1 hover:text-teal-600">${clinicData.contact.phone}</a></p>
                                            <p class="flex items-center">${createIcon('mail', 'w-5 h-5 mr-3 text-teal-600 flex-shrink-0')}<strong>Email:</strong> <a href="mailto:${clinicData.contact.email}" class="ml-1 hover:text-teal-600">${clinicData.contact.email}</a></p>
                                        </div>
                                    </div>
                                    <div>
                                        <h3 class="text-xl font-semibold text-teal-700 mb-3">Office Hours</h3>
                                        <ul class="list-disc list-inside text-gray-700 space-y-1">
                                            <li>Monday - Friday: 9:00 AM - 5:00 PM</li>
                                            <li>Saturday: 10:00 AM - 2:00 PM (By Appointment Only)</li>
                                            <li>Sunday: Closed</li>
                                        </ul>
                                    </div>
                                    <div class="mt-8">
                                        <h3 class="text-xl font-semibold text-teal-700 mb-3">Find Us</h3>
                                        <div class="aspect-w-16 aspect-h-9 rounded-lg overflow-hidden shadow-md">
                                            <iframe src="${clinicData.contact.mapEmbedUrl}" width="100%" height="350" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="Clinic Location Map"></iframe>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <section class="py-16 sm:py-24 bg-teal-50">
                        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <h2 class="text-3xl font-bold text-teal-700 text-center mb-12">Frequently Asked Questions</h2>
                            <div class="space-y-6 max-w-3xl mx-auto">${faqHtml}</div>
                        </div>
                    </section>
                </div>
            `;
        }

        // --- NAVIGATION AND PAGE DISPLAY LOGIC ---
        let currentPageId = 'home'; // Default page

        function displayPage(pageId) {
            // Hide all sections
            document.querySelectorAll('.page-section').forEach(section => {
                section.classList.remove('active');
            });

            const mainContentContainer = document.getElementById('main-content');
            let contentHtml = '';

            // Determine the ID of the page container element and get content
            let elementIdToFind;
            if (pageId.startsWith('service/')) {
                const serviceId = pageId.split('/')[1];
                contentHtml = renderServiceDetailPage(serviceId);
                elementIdToFind = 'service-detail-page';
            } else if (pageId.startsWith('blog/')) {
                const postId = pageId.split('/')[1];
                contentHtml = renderBlogPostPage(postId);
                elementIdToFind = 'blog-post-page';
            } else {
                elementIdToFind = pageId + '-page';
                switch (pageId) {
                    case 'home': contentHtml = renderHomePage(); break;
                    case 'about': contentHtml = renderAboutPage(); break;
                    case 'services': contentHtml = renderServicesPage(); break;
                    case 'gallery': contentHtml = renderGalleryPage(); break;
                    case 'testimonials': contentHtml = renderTestimonialsPage(); break;
                    case 'blog': contentHtml = renderBlogListPage(); break;
                    case 'contact': contentHtml = renderContactPage(); break;
                    default: 
                        contentHtml = renderHomePage(); 
                        elementIdToFind = 'home-page'; // Fallback to home page ID
                }
            }
            
            let pageElement = document.getElementById(elementIdToFind);

            if (!pageElement) { // If the page element doesn't exist, create it
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = contentHtml.trim(); 
                
                if (tempDiv.firstChild && tempDiv.firstChild.nodeType === Node.ELEMENT_NODE) {
                    pageElement = tempDiv.firstChild;
                    mainContentContainer.appendChild(pageElement);
                } else {
                    console.error(`Failed to create page element from contentHtml for pageId: '${pageId}'. tempDiv.firstChild is not an element or is null. contentHtml was:`, contentHtml);
                    return; // Stop if element creation failed
                }
            } else { // If page element exists, update its content
                if (pageId.startsWith('service/') || pageId.startsWith('blog/')) {
                    // For detail pages, we re-render the content.
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = contentHtml.trim();
                    const newContentElement = tempDiv.firstChild;
                    if (newContentElement && newContentElement.nodeType === Node.ELEMENT_NODE) {
                        pageElement.innerHTML = newContentElement.innerHTML; // Update innerHTML of existing element
                    } else {
                        console.error(`Failed to extract new innerHTML for detail page: '${pageId}'. contentHtml was:`, contentHtml);
                        pageElement.innerHTML = ''; // Clear old content as a fallback
                    }
                }
                // For non-detail pages that already exist, we don't need to re-render their content, just show them.
            }

            // Activate the current page element
            if (pageElement && typeof pageElement.classList !== 'undefined') {
                pageElement.classList.add('active');
            } else {
                console.error(`pageElement is invalid or does not have classList before adding 'active' class for pageId: '${pageId}'. pageElement:`, pageElement);
                return; // Stop if pageElement is still not valid
            }

            currentPageId = pageId;
            window.scrollTo(0, 0);
            lucide.createIcons(); // Re-initialize icons after new content is added

            // Re-attach event listeners for dynamically added content if necessary
            if (pageId === 'contact') attachContactFormListener();
            if (pageId === 'about') attachDoctorBioModalListener();
        }

        // --- EVENT LISTENERS ---
        function setupEventListeners() {
            // Navbar links
            document.getElementById('navbar').addEventListener('click', function(e) {
                if (e.target.closest('.nav-link')) {
                    e.preventDefault();
                    const page = e.target.closest('.nav-link').dataset.page;
                    if (page) {
                        displayPage(page);
                        // Close mobile menu if open
                        const mobileMenu = document.getElementById('mobile-menu');
                        const menuButton = document.getElementById('mobile-menu-button');
                        if (mobileMenu && !mobileMenu.classList.contains('hidden')) {
                            mobileMenu.classList.add('hidden');
                            menuButton.setAttribute('aria-expanded', 'false');
                            menuButton.children[0].classList.remove('hidden'); // Show menu icon
                            menuButton.children[1].classList.add('hidden');    // Hide X icon
                        }
                    }
                }
            });
             // Footer links (delegate event for dynamically added footer)
            document.getElementById('footer').addEventListener('click', function(e) {
                if (e.target.closest('.nav-link')) {
                    e.preventDefault();
                    const page = e.target.closest('.nav-link').dataset.page;
                    if (page) displayPage(page);
                }
            });


            // Mobile menu toggle
            const mobileMenuButton = document.getElementById('mobile-menu-button');
            const mobileMenu = document.getElementById('mobile-menu');
            if (mobileMenuButton && mobileMenu) {
                mobileMenuButton.addEventListener('click', () => {
                    const isExpanded = mobileMenuButton.getAttribute('aria-expanded') === 'true' || false;
                    mobileMenuButton.setAttribute('aria-expanded', !isExpanded);
                    mobileMenu.classList.toggle('hidden');
                    // Toggle icons
                    mobileMenuButton.children[0].classList.toggle('hidden'); // Menu icon
                    mobileMenuButton.children[1].classList.toggle('hidden'); // X icon
                });
            }
            
            // Event delegation for nav-links within dynamic content (main content area)
            document.getElementById('main-content').addEventListener('click', function(e) {
                const navLink = e.target.closest('.nav-link');
                if (navLink && navLink.dataset.page) {
                    e.preventDefault();
                    displayPage(navLink.dataset.page);
                }
            });
        }
        
        function attachContactFormListener() {
            const contactForm = document.getElementById('contactForm');
            if (contactForm) {
                // Remove existing listener to prevent duplicates if page is re-rendered
                const newForm = contactForm.cloneNode(true);
                contactForm.parentNode.replaceChild(newForm, contactForm);

                newForm.addEventListener('submit', async function(e) {
                    e.preventDefault();
                    const submitBtn = document.getElementById('contactFormSubmitBtn');
                    const statusDiv = document.getElementById('contactFormStatus');
                    statusDiv.innerHTML = '';
                    submitBtn.disabled = true;
                    submitBtn.innerHTML = `Sending... ${createIcon('loader-2', 'animate-spin w-5 h-5 inline-block ml-2')}`;
                    lucide.createIcons();


                    // Simulate API call
                    await new Promise(resolve => setTimeout(resolve, 1500));
                    
                    if (Math.random() > 0.2) { // Simulate success
                        statusDiv.innerHTML = `<div class="p-3 rounded-md bg-green-50 border border-green-300 text-green-700 flex items-center">${createIcon('check-circle', 'w-5 h-5 mr-2')} Message sent successfully! We'll be in touch soon.</div>`;
                        newForm.reset();
                    } else { // Simulate error
                        statusDiv.innerHTML = `<div class="p-3 rounded-md bg-red-50 border border-red-300 text-red-700 flex items-center">${createIcon('x-circle', 'w-5 h-5 mr-2')} Oops! Something went wrong. Please try again.</div>`;
                    }
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Send Message';
                    lucide.createIcons(); 
                });
            }
        }

        function attachDoctorBioModalListener() {
            const learnMoreBtn = document.getElementById('learnMoreDoctorBtn');
            const modalOverlay = document.getElementById('doctorBioModal');
            const modalContentEl = document.getElementById('doctorBioModalContent');
            const closeModalBtn = document.getElementById('closeDoctorBioModal');

            if (learnMoreBtn && modalOverlay && closeModalBtn && modalContentEl) {
                 // To prevent multiple listeners if about page is re-visited (though it's not re-rendered fully here)
                const newLearnMoreBtn = learnMoreBtn.cloneNode(true);
                learnMoreBtn.parentNode.replaceChild(newLearnMoreBtn, learnMoreBtn);

                newLearnMoreBtn.addEventListener('click', () => {
                    const doctor = clinicData.doctors[0];
                    modalContentEl.innerHTML = `
                        <h3 class="text-xl font-bold text-teal-700 mb-4">${doctor.name} - Full Bio</h3>
                        <p class="text-gray-700 mb-2">${doctor.specialty}</p>
                        <p class="text-gray-600 text-sm mb-4">${doctor.bio}</p>
                        <h5 class="font-semibold text-teal-700 mt-3 mb-1">Education:</h5>
                        <ul class="list-disc pl-5 text-sm text-gray-600 mb-3">
                            ${doctor.education.map(edu => `<li>${edu}</li>`).join('')}
                        </ul>
                        <h5 class="font-semibold text-teal-700 mt-3 mb-1">Certifications:</h5>
                        <ul class="list-disc pl-5 text-sm text-gray-600 mb-4">
                            ${doctor.certifications.map(cert => `<li>${cert}</li>`).join('')}
                        </ul>
                    `;
                    modalOverlay.classList.add('active');
                });

                // Ensure close listeners are only attached once or are idempotent
                if (!closeModalBtn.dataset.listenerAttached) {
                    closeModalBtn.addEventListener('click', () => {
                        modalOverlay.classList.remove('active');
                    });
                    modalOverlay.addEventListener('click', (event) => {
                        if (event.target === modalOverlay) {
                             modalOverlay.classList.remove('active');
                        }
                    });
                    closeModalBtn.dataset.listenerAttached = 'true';
                }
            }
        }


        // --- INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', () => {
            renderNavbar();
            renderFooter();
            displayPage(currentPageId); // Display initial page (home)
            setupEventListeners();
            lucide.createIcons(); // Initial icon rendering
        });

    </script>
</body>
</html>
